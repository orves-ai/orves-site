<script>
// Estado vindo do worker por query param — contrato real de app/worker.js:
// /login?error=cred|rate (falha), ?verified=1 (e-mail confirmado no fluxo de
// verificação), ?reset=1 (senha trocada). verified/reset eram redirects REAIS
// que a página antiga ignorava — o usuário chegava sem saber que deu certo.
(function(){
  var q = new URLSearchParams(location.search);
  var el = document.getElementById('autherr');
  var MSG = {
    cred: ['bad', 'We couldn’t sign you in with those credentials. Check your email and password and try again.'],
    rate: ['bad', 'Too many sign-in attempts. Wait a few minutes and try again.']
  };
  var m = null;
  if (q.get('error')) m = MSG[q.get('error')] || ['bad', 'We couldn’t sign you in. Please try again.'];
  else if (q.get('verified') === '1') m = ['good', 'Email confirmed — sign in to continue.'];
  else if (q.get('reset') === '1') m = ['good', 'Password updated — sign in with your new password.'];
  if (!m) return;
  el.classList.add(m[0]); el.textContent = m[1]; el.hidden = false;
  // Depois de um erro o e-mail digitado volta ao campo — via sessionStorage,
  // nunca pela URL (e-mail em query string vaza para histórico e logs).
  if (m[0] === 'bad') {
    try {
      var e = sessionStorage.getItem('orves_login_email');
      var i = document.querySelector('.authform [name=email]');
      if (e && i && !i.value) i.value = e;
    } catch (err) {}
  }
})();

// Validação local + estado de envio. O servidor revalida tudo; aqui só se
// evita um round-trip por campo vazio e se dá feedback de progresso.
(function(){
  var form = document.querySelector('.authform'); if (!form) return;
  var em = form.querySelector('[name=email]'), pw = document.getElementById('pw'),
      btn = document.getElementById('signin'),
      emErr = document.getElementById('emailerr'), pwErr = document.getElementById('pwerr');
  // Mesma regex de sintaxe do cadastro (literal, não string — o \s sobrevive).
  var EMAIL_RE = /^[^@\s<>"'&\\]+@[^@\s]+\.[^@\s.]{2,}$/;
  function setErr(input, out, msg){
    out.textContent = msg || ''; out.hidden = !msg;
    if (msg) input.setAttribute('aria-invalid', 'true');
    else input.removeAttribute('aria-invalid');
  }
  em.addEventListener('input', function(){ setErr(em, emErr, ''); });
  pw.addEventListener('input', function(){ setErr(pw, pwErr, ''); });
  form.addEventListener('submit', function(ev){
    var e1 = !em.value.trim() ? 'Enter your email address.'
           : !EMAIL_RE.test(em.value.trim()) ? 'Enter a valid email address.' : '';
    var e2 = !pw.value ? 'Enter your password.' : '';
    setErr(em, emErr, e1); setErr(pw, pwErr, e2);
    if (e1 || e2) { ev.preventDefault(); (e1 ? em : pw).focus(); return; }
    try { sessionStorage.setItem('orves_login_email', em.value.trim()); } catch (err) {}
    btn.classList.add('busy'); btn.textContent = 'Signing in…';
    // disable DEPOIS de a submissão entrar na fila — botão desabilitado
    // sincronamente cancela o submit em alguns navegadores.
    setTimeout(function(){ btn.disabled = true; }, 0);
  });
  // bfcache: quem volta com o botão travado ficaria preso.
  window.addEventListener('pageshow', function(){
    btn.disabled = false; btn.classList.remove('busy'); btn.textContent = 'Sign in';
  });
})();

// Mostrar/ocultar senha + Caps Lock (getModifierState é o único sinal
// confiável; o aviso morre no blur para não sobrar apontando para nada).
(function(){
  var pw = document.getElementById('pw'), eye = document.getElementById('pweye'),
      caps = document.getElementById('capsw');
  if (!pw || !caps) return;
  if (eye) eye.addEventListener('click', function(){
    var show = pw.type === 'password';
    var s = pw.selectionStart, e = pw.selectionEnd, focado = document.activeElement === pw;
    pw.type = show ? 'text' : 'password';
    eye.textContent = show ? 'hide' : 'show';
    eye.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    if (focado) { pw.focus(); try { pw.setSelectionRange(s, e); } catch (err) {} }
  });
  function on(ev){ if (typeof ev.getModifierState === 'function') caps.hidden = !ev.getModifierState('CapsLock'); }
  pw.addEventListener('keydown', on); pw.addEventListener('keyup', on);
  pw.addEventListener('blur', function(){ caps.hidden = true; });
})();
</script>
