<section style="border-top:0;padding:44px 0 44px">
  <div class="hero hero-auth" style="padding:0;border-top:0;gap:60px;align-items:start">
    
    <div class="auth rv" style="margin:0">
      <h2 style="font-size:22px;margin:0 0 18px">创建账户</h2>
      <div id="autherr" style="display:none;border:1px solid color-mix(in srgb,var(--hold) 50%,transparent);background:color-mix(in srgb,var(--hold) 8%,transparent);border-radius:8px;padding:10px 14px;font-size:12.5px;color:var(--hold);margin-bottom:14px"></div>
      <form class="authform" method="post" action="https://dashboard.orves.ai/api/signup">
        <!-- Rótulo FORA do campo, como no login. Placeholder some no primeiro
             caractere: quem revisa o formulário preenchido perde a identidade
             de cada campo, e leitor de tela não tem nome acessível estável.
             Placeholder fica só para EXEMPLO de formato, nunca para nomear.
             O <div class="afin"> existe porque ✓/✕ e o botão SHOW são
             absolutos: sem ele o `top:50%` passa a valer sobre rótulo+campo e
             os dois sobem para cima da borda do input. -->
        <label class="af"><span>姓名</span>
          <input type="text" name="name" required autocomplete="name" style="margin-top:0"/></label>
        <label class="af af-state" id="emwrap"><span>邮箱</span>
          <div class="afin"><input type="email" name="email" required autocomplete="email" style="margin-top:0"/><span class="emicon" aria-hidden="true"></span></div></label>
        <div id="emstat" class="emstat" hidden></div>
        <!-- aria-label no input: o botão SHOW vive dentro do <label>, e o nome
             acessível calculado viraria "PASSWORD Show password". -->
        <label class="af"><span>密码</span>
          <div class="afin"><input type="password" id="pw" name="password" required minlength="8" maxlength="256" aria-label="密码" autocomplete="new-password" style="margin-top:0;padding-right:44px"/>
          <button type="button" class="pweye" id="pweye" aria-label="显示密码">显示</button></div></label>
        <!-- O campo de confirmação responde por si. Antes, "não confere" só
             existia como item de lista, e o usuário tinha de olhar para outro
             lugar da tela para descobrir o que havia de errado bem debaixo do
             cursor. Divisão de trabalho: a lista diz o que FALTA, o campo diz
             o que está ERRADO. -->
        <label class="af af-state" id="pw2wrap"><span>确认密码</span>
          <div class="afin"><input type="password" id="pw2" autocomplete="new-password" style="margin-top:0"/><span class="emicon" aria-hidden="true"></span></div></label>
        <div id="pw2stat" class="emstat" hidden></div>
        <div id="capsw" class="capswarn" hidden>⇪ Caps Lock 已开启</div>
        <!-- Sem barra de progresso. Ela sobrou de quando havia um score de
             entropia; sem score, uma barra que enche não diz o que significa —
             a lista já diz, e diz melhor. Sem dica também: campo vazio não tem
             nada a corrigir. -->
        <div class="pwreq" id="pwreq"><div class="pwinner">
          <div class="pwlab" id="pwlab"></div>
          <!-- Duas classes de validação, e o usuário precisa distinguir:
               REQUIREMENTS é o que ele digita; SECURITY CHECKS é o que o
               sistema confere por trás. Misturar as duas numa lista só fazia
               "not predictable" parecer uma regra de digitação. -->
          <!-- Os QUATRO itens ficam sempre visíveis, na mesma ordem: nenhum
               entra, sai ou se desloca. Só o marcador muda (○ → ✓ / ✕). Lista
               que encolhe a cada tecla obriga o usuário a acompanhar linhas se
               movendo e apaga a prova do que ele já cumpriu.

               Texto como INSTRUÇÃO, não como rótulo: "Use at least 8
               characters" diz o que fazer, não só nomeia a regra.
               Sem regras de composição (decisão BP 27-jul-2026, NIST
               SP 800-63B): maiúscula/número/símbolo obrigatórios empurram
               para o previsível; quem barra senha fraca é a lista de comuns,
               identidade e vazamento — como em app/worker.js.
               As duas últimas são checagens automáticas do sistema, não regras
               de digitação — ficam por último, e quando falham explicam por que
               o botão está travado. -->
          <ul id="pwreq1">
            <li data-k="len">请使用至少 8 个字符</li>
            <li data-k="match">两次输入的密码必须一致</li>
            <li data-k="cmn">请选择一个不那么常见的密码</li>
            <li data-k="idn">不要使用你的姓名或邮箱</li>
          </ul>
        </div></div>
        <button class="btn" type="submit" id="pwsubmit" disabled style="width:100%">创建免费账户</button>
      </form>
      
      <p style="font-size:12.5px;color:var(--fg3);margin-top:14px">已经有账户了？<a href="login">登录</a></p>

        <text x="170" y="100" text-anchor="middle" style="font-family:JetBrains Mono,monospace;font-size:9px;fill:var(--fg3)">知识图谱</text>
      </svg>

<script>
(function(){
  var e = new URLSearchParams(location.search).get('error');
  if(!e) return;
  var msg = { exists: 'An account with this email already exists — sign in instead.',
              pwpolicy: 'That password does not meet the requirements below.',
              // Mensagem separada de propósito: quando a recusa não corresponde
              // a nenhum item da lista abaixo, mandar reler a lista não dá ao
              // usuário nada para corrigir.
              pwbreach: 'This password has appeared in a known data breach. Choose a different password that you do not use anywhere else.',
              invalid: 'Please check your name and email and try again.' }[e] || 'Something went wrong — please try again.';
  var el = document.getElementById('autherr'); el.textContent = msg; el.style.display = 'block';
})();

// Sintaxe local: só orienta a UX. O servidor revalida tudo.
// Literal de regex de propósito: como string, o `\s` era comido pelo escape e
// a classe virava "qualquer coisa menos a letra s" — todo e-mail com "s" era
// recusado. O teste de comportamento pegou isso antes de ir ao ar.
window.EMAIL_LOCAL_RE = /^[^@\s<>"'&\\]+@[^@\s]+\.[^@\s.]{2,}$/;

// Estado do e-mail ao vivo. O formato é checado aqui; a capacidade do DOMÍNIO
// de receber e-mail vem do servidor. Nada aqui afirma que a CAIXA existe —
// isso só o código de confirmação prova.
(function(){
  var el=document.querySelector('[name=email]'), out=document.getElementById('emstat');
  if(!el||!out) return;
  // Mensagem por CAUSA: "inválido" não diz ao usuário o que corrigir.
  var MSG={
    invalid_format:      'Enter a valid email address.',
    domain_cannot_receive:"This email domain can't receive email.",
    disposable_domain:   "Disposable email addresses aren't supported.",
    temporary_dns_failure:"Couldn't check this domain — tap to retry.",
    rate_limited:        'Too many checks. Wait a moment.'
  };
  var wrap=document.getElementById('emwrap');
  // O ícone dentro do campo e a mensagem abaixo dele são o MESMO estado.
  // Sequência deliberada: digitando = nada · regex ok = spinner · DNS ok = ✓.
  // O ✓ nunca aparece só porque a regex passou.
  function show(cls,txt){
    out.hidden=!txt; out.className='emstat '+cls; out.textContent=txt||'';
    if(!wrap) return;
    wrap.classList.remove('is-good','is-bad','is-wait');
    if(cls==='good') wrap.classList.add('is-good');
    else if(cls==='bad') wrap.classList.add('is-bad');
    else if(cls==='wait') wrap.classList.add('is-wait');
  }
  function localOk(v){ return window.EMAIL_LOCAL_RE.test(v.trim()); }
  var t=null, ultimo=null, pendente=false, tocado=false;
  // Retry sem obrigar o usuário a reescrever o endereço.
  out.addEventListener('click', function(){
    if (out.classList.contains('warn')) { ultimo = null; check(); }
  });
  window.__orvesEmailPending = function(){ return pendente; };
  function check(){
    var v=el.value.trim();
    if(!v){ pendente=false; show('',''); return; }
    if(!localOk(v)){
      pendente=false;
      // Enquanto o usuário ainda está escrevendo, silêncio. "a@a" no meio da
      // digitação não é erro — é uma frase pela metade. O ✕ só aparece depois
      // que ele sai do campo.
      show(tocado ? 'bad' : '', tocado ? MSG.invalid_format : '');
      return;
    }
    if(v===ultimo) return;
    show('wait','Checking domain…'); pendente=true;
    fetch('https://dashboard.orves.ai/api/email/check',{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({email:v})})
      .then(function(r){ return r.json(); })
      .then(function(d){
        pendente=false;
        if(el.value.trim()!==v) return;
        ultimo=v;
        var bad = !(d.format && (d.domain || d.retryable));
        // "Email looks good", não "verified": posse só se prova com o código
        // enviado ao endereço. Dizer "verificado" aqui seria falso.
        if(d.format&&d.domain){ show('good','Email looks good'); }
        else { show(d.retryable?'warn':'bad', MSG[d.code]||MSG.invalid_format); }
        // Domínio reprovado pelo servidor também desabilita o botão. Falha
        // temporária de DNS NÃO reprova — o servidor revalida no envio.
        if (window.__orvesEmailBad) window.__orvesEmailBad(bad);
      })
      .catch(function(){ pendente=false; show('',''); });   // rede caiu: não bloqueia o usuário
  }
  el.addEventListener('input',function(){
    clearTimeout(t); ultimo=null;
    if (window.__orvesEmailBad) window.__orvesEmailBad(false);   // limpa veredito velho
    t=setTimeout(check,600);
  });
  el.addEventListener('blur',function(){ clearTimeout(t); tocado=true; check(); });
})();

// Checklist de senha ao vivo. ESPELHA passwordCheck() em app/worker.js — o
// servidor é a autoridade e repete tudo (mais a checagem de vazamento).
// Mudou a regra aqui? Mude lá também.
(function(){
  var pw = document.getElementById('pw'), pw2 = document.getElementById('pw2'),
      box = document.getElementById('pwreq'),
      lab = document.getElementById('pwlab'), btn = document.getElementById('pwsubmit'),
      eye = document.getElementById('pweye'), form = pw.form;
  if(!pw) return;
  var COMMON = ('password passwd senha admin administrator root user guest test welcome letmein '+
    'qwerty qwertyui asdf asdfgh zxcvbn monkey dragon master login secret abc iloveyou sunshine '+
    'princess football baseball superman batman trustno shadow michael jennifer jordan harley '+
    'ranger hunter buster soccer hockey killer george andrew charlie thomas robert daniel matthew '+
    'joshua summer winter spring autumn january changeme default temporary orves orvesai anthropic '+
    'openai google github microsoft azure aws cloudflare stripe supabase postgres mysql mongodb '+
    'redis docker kubernetes linux windows macos android iphone samsung nokia motorola').split(' ');
  var LEET = {'0':'o','1':'l','3':'e','4':'a','5':'s','7':'t','8':'b','@':'a','$':'s','!':'i','|':'l'};
  function cands(s){
    var low=s.toLowerCase();
    var full=low.split('').map(function(c){return LEET[c]||c;}).join('').replace(/[^a-z0-9]/g,'');
    var sym=low.split('').map(function(c){return /[0-9]/.test(c)?c:(LEET[c]||c);}).join('').replace(/[^a-z0-9]/g,'').replace(/[0-9]+$/,'');
    return [full, full.replace(/[0-9]+$/,''), sym].filter(Boolean);
  }
  function isCommon(s){ return cands(s).some(function(c){
    return COMMON.some(function(w){ return c===w || (w.length>=5 && c.indexOf(w)>=0); }); }); }
  function norm(s){ return cands(s)[1]||''; }
  function weakPattern(s){
    s = s.toLowerCase();
    if(/^(.)\1*$/.test(s)) return true;
    var runs='abcdefghijklmnopqrstuvwxyz0123456789qwertyuiopasdfghjklzxcvbnm';
    for(var i=0;i+4<=runs.length;i++){
      var seg=runs.slice(i,i+4);
      if(s.indexOf(seg)>=0 || s.indexOf(seg.split('').reverse().join(''))>=0) return true;
    }
    return false;
  }
  function related(s){
    var base=norm(s); if(!base) return false;
    var em=(form.querySelector('[name=email]')||{}).value||'';
    var nm=(form.querySelector('[name=name]')||{}).value||'';
    var parts=[]; em=em.toLowerCase();
    if(em.indexOf('@')>0){ parts.push(em.split('@')[0], em.split('@')[1].split('.')[0]); }
    nm.toLowerCase().split(/\s+/).forEach(function(w){ parts.push(w); });
    return parts.some(function(w){
      var t=w.replace(/[^a-z0-9]/g,'');
      return t.length>=4 && (base.indexOf(t)>=0 || t.indexOf(base)>=0);
    });
  }
  function strength(v, penal){
    var space=0;
    if(/\p{Ll}/u.test(v)) space+=26;
    if(/\p{Lu}/u.test(v)) space+=26;
    if(/\p{N}/u.test(v))  space+=10;
    if(/[^\p{L}\p{N}\s]/u.test(v)) space+=33;
    if(/\s/.test(v)) space+=1;
    var uniq=new Set(v).size;
    var bits=Math.log2(Math.max(space,2))*Math.min(v.length,40);
    bits*=Math.min(1, uniq/Math.max(8, v.length*0.6));
    if(penal) bits=Math.min(bits,28);
    return bits<40?0:bits<55?1:bits<70?2:bits<90?3:4;
  }
  // Título ESTÁVEL. "Your password needs" descrevia uma lista que só mostrava
  // pendências; com a lista fixa, itens já cumpridos ficam visíveis e a frase
  // passa a mentir sobre metade deles. "Password requirements" nomeia o bloco
  // em qualquer estado — e só troca quando não há mais nada a cobrar.
  // Nada de "Excellent"/"Fair"/"Good": obrigavam a distinguir cinco categorias
  // por diferenças de um caractere, sem explicar nenhuma. Dois estados, ambos
  // derivados dos REQUISITOS — nunca de um score de entropia paralelo.
  var LABELS=['Password requirements','Password meets all requirements'];
  var COLORS=['var(--fg3)','#22C07E'];
  var strict=false;   // vira true no blur ou na tentativa de enviar
  function run(){
    var v=pw.value, c={
      len: v.length>=8 && v.length<=256,
      // Separadas: "é uma senha conhecida" e "é a sua própria identidade" são
      // checagens diferentes, e o usuário corrige cada uma de um jeito.
      cmn: v.length>0 && !isCommon(v) && !weakPattern(v),
      idn: v.length>0 && !related(v),
      match: v.length>0 && v===pw2.value
    };
    // O campo de confirmação fala por si: borda e ícone. Enquanto ele está
    // VAZIO não há erro nenhum — só falta digitar, e quem diz isso é a lista.
    var w2 = document.getElementById('pw2wrap'), st2 = document.getElementById('pw2stat');
    var confDigitada = pw2.value.length > 0;
    w2.classList.toggle('is-good', confDigitada && c.match);
    w2.classList.toggle('is-bad',  confDigitada && !c.match);
    st2.hidden = !(confDigitada && !c.match);
    st2.textContent = "Passwords don't match.";
    st2.className = 'emstat bad';

    var allOk=true;
    box.querySelectorAll('li').forEach(function(li){
      var okk=c[li.dataset.k];
      // TRÊS estados por item, e NENHUM deles some: ✓ verde quando cumprido,
      // ○ cinza enquanto pendente, ✕ âmbar só depois de sair do campo ou tentar
      // enviar. Marcar erro a cada tecla pune quem ainda está escrevendo.
      // "Passwords must match" fica na lista mesmo com a confirmação digitada e
      // diferente: o campo acusa o ERRO, a lista mantém a POLÍTICA visível.
      li.className = okk ? 'on' : (strict ? 'off' : '');
      if(!okk) allOk=false;
    });
    // Campo vazio: a seção inteira fica invisível. A tela é de criar conta.
    // Depois do primeiro caractere ela nunca mais se mexe.
    box.classList.toggle('typing', v.length > 0);
    var KEYS = ['len','match','cmn','idn'];
    var faltam = KEYS.filter(function(k){ return !c[k]; });
    var s = allOk && v.length ? 1 : 0;
    lab.textContent = LABELS[s];
    lab.style.color = COLORS[s];
    // Fecha tudo: check grande + transição. O olho acha o ✓ antes de ler.
    lab.classList.toggle('done', allOk && v.length > 0);
    box.querySelectorAll('li').forEach(function(li){
      li.classList.toggle('only', faltam.length === 1 && li.dataset.k === faltam[0] && v.length > 0);
    });
    var valido = allOk && formOk();
    // Reação discreta: ao ficar tudo válido, o grafo acelera por alguns
    // segundos e volta ao ritmo calmo.
    if (valido && btn.disabled) {
      if (window.__orvesGraphBoost) window.__orvesGraphBoost();
      // Confirma a virada por meio segundo e volta ao rótulo de ação.
      var rot = btn.textContent;
      btn.textContent = "✓ Ready";
      btn.classList.add("ready");
      setTimeout(function(){ btn.textContent = rot; btn.classList.remove("ready"); }, 500);
    }
    btn.disabled = !valido;
  }
  // Caps Lock: erro de digitação silencioso é uma das maiores causas de
  // "minha senha não funciona". getModifierState é o único jeito confiável.
  var caps = document.getElementById('capsw');
  function caps_(ev){
    if (typeof ev.getModifierState !== 'function') return;
    caps.hidden = !ev.getModifierState('CapsLock');
  }
  [pw, pw2].forEach(function(el){
    el.addEventListener('keydown', caps_);
    el.addEventListener('keyup', caps_);
    el.addEventListener('blur', function(){ caps.hidden = true; });
  });
  // Abre no PRIMEIRO CARACTERE, não no foco. Abrir no foco enche a tela de
  // regras antes de o usuário tentar qualquer coisa — o campo vazio não tem
  // nada a corrigir, e a tela é de criar conta, não de aprender política de
  // senha. run() adiciona .typing assim que há conteúdo.
  // Nome preenchido e e-mail com formato válido — e não reprovado pelo
  // servidor. Checagem de domínio ainda em voo não trava o botão.
  var emailBad=false;
  function formOk(){
    var nm=(form.querySelector('[name=name]')||{}).value||'';
    var em=(form.querySelector('[name=email]')||{}).value||'';
    return nm.trim().length>0 && window.EMAIL_LOCAL_RE.test(em.trim()) && !emailBad;
  }
  window.__orvesEmailBad = function(b){ emailBad=!!b; run(); };
  [pw, pw2].forEach(function(el){
    el.addEventListener('blur', function(){ strict = true; run(); });
  });
  form.addEventListener('submit', function(ev){
    strict = true; run();
    if (btn && btn.disabled) { ev.preventDefault(); return; }
    if (window.__orvesEmailPending && window.__orvesEmailPending()) {
      ev.preventDefault();
      btn.disabled = true;
      var esperou = 0;
      var iv = setInterval(function(){
        esperou += 100;
        if (!window.__orvesEmailPending() || esperou >= 2500) {
          clearInterval(iv); run();
          if (!btn.disabled) form.submit();
        }
      }, 100);
    }
  });
  pw.addEventListener('input',run); pw2.addEventListener('input',run);
  ['[name=email]', '[name=name]'].forEach(function(sel){
    var el = form.querySelector(sel);
    if (el) { el.addEventListener('input', run); el.addEventListener('blur', run); }
  });
  eye.addEventListener('click',function(){
    var show = pw.type==='password';
    pw.type = pw2.type = show ? 'text' : 'password';
    eye.textContent = show ? 'hide' : 'show';
  });
  run();
})();
</script>
