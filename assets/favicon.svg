<svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 34 34" fill="none">
<!-- ORVES favicon — arte A2 (docs/brand/orves-aperture-responsive.svg), geometria
     byte-idêntica: anel r15.3/1.5 + anel r8.6/3 + ponto r2. APERTURE_SYSTEM §2:
     favicon = A2; fundo escuro <48px = ponto claro. Base = variante DARK (ordem
     BP 26-jul); o ponto é "tinta do contexto", então a aba clara recebe a tinta
     escura canônica (#131417) via prefers-color-scheme. Não recolorir os anéis. -->
<style>.dot{fill:#E8ECF4}@media(prefers-color-scheme:light){.dot{fill:#131417}}</style>
<circle cx="17" cy="17" r="15.3" stroke="#22C07E" stroke-width="1.5"/>
<circle cx="17" cy="17" r="8.6" stroke="#4FD69B" stroke-width="3"/>
<circle class="dot" cx="17" cy="17" r="2"/>
</svg>
