<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>

<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://dashboard.orves.ai; object-src 'none'; base-uri 'none'; form-action 'self' https://dashboard.orves.ai"/>
<title>Log in | Orves</title>
<meta name="description" content="Log in to your Orves dashboard."/>
<link rel="canonical" href="https://orves.ai/login"/>
<meta property="og:title" content="Log in | Orves"/>
<meta property="og:description" content="Log in to your Orves dashboard."/>
<meta property="og:type" content="website"/>
<meta property="og:url" content="https://orves.ai/login"/>
<meta property="og:site_name" content="Orves"/>
<meta name="twitter:card" content="summary"/>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml"/>
<link rel="icon" href="assets/favicon.ico" sizes="16x16 32x32 48x48"/>
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;450;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/orves.css">
</head>
<body>
<div class="grid-bg"></div>
<div class="page">

<nav><div class="wrap navin">
  <a class="brand" href="./"><svg width="26" height="26" viewBox="0 0 34 34" fill="none"><circle cx="17" cy="17" r="15.3" stroke="var(--brand)" stroke-width="1.5"/><circle cx="17" cy="17" r="8.6" stroke="var(--brand2)" stroke-width="3"/><circle cx="17" cy="17" r="2" fill="var(--fg)"/></svg><span class="word">Orves</span></a>
  <span class="sp"></span>
  <a class="si" href="./">← Back</a>
</div></nav>


<main class="wrap">


<section class="center" style="border-top:0;padding:90px 0 40px">
  <div class="auth rv">
    <div style="display:flex;justify-content:center;margin-bottom:18px"><svg width="40" height="40" viewBox="0 0 34 34" fill="none"><circle cx="17" cy="17" r="15.3" stroke="var(--brand)" stroke-width="1.5"/><circle cx="17" cy="17" r="8.6" stroke="var(--brand2)" stroke-width="3"/><circle cx="17" cy="17" r="2" fill="var(--fg)"/></svg></div>
    <h2 style="font-size:26px;margin:0 0 6px">Log in to Orves</h2>
    <p style="font-size:13.5px;color:var(--fg2);margin-bottom:26px">Manage your knowledge infrastructure.</p>
    <div id="autherr" style="display:none;border:1px solid color-mix(in srgb,var(--hold) 50%,transparent);background:color-mix(in srgb,var(--hold) 8%,transparent);border-radius:8px;padding:10px 14px;font-size:12.5px;color:var(--hold);margin-bottom:14px"></div>
    <form class="authform" method="post" action="https://dashboard.orves.ai/api/login">
      <label class="af">
        <span>Email</span>
        <input type="email" name="email" required placeholder="you@company.com" autocomplete="email"/>
      </label>
      <label class="af">
        <span style="display:flex;justify-content:space-between">Password <a href="forgot-password" style="color:var(--acc2);text-transform:none;letter-spacing:0">Forgot password?</a></span>
        <input type="password" name="password" required placeholder="••••••••••" autocomplete="current-password"/>
      </label>
      
      <div id="capsw" class="capswarn" hidden>⇪ Caps Lock is on</div>
      <button class="btn" type="submit" style="width:100%">Log in</button>
    </form>
    
    <div class="authdiv"><span>or</span></div>
    <a class="btn gh" style="width:100%;text-align:center" href="https://dashboard.orves.ai/login/code">Email me a code instead</a>
    <div class="authdiv"><span>no account yet?</span></div>
    <a class="btn gh" style="width:100%;text-align:center" href="create-account">Create free account</a>
  </div>
</section>

<script>
(function(){
  var e = new URLSearchParams(location.search).get('error');
  if(!e) return;
  var el = document.getElementById('autherr'); el.textContent = 'Wrong email or password.'; el.style.display = 'block';
})();

// Caps Lock: a causa mais comum de "minha senha está certa e não entra".
// Vivia no {% block title %}, o que punha um <script> DENTRO do <title> —
// a aba mostrava código. Script é corpo, não cabeçalho.
(function(){
  var f=document.querySelector('.authform'); if(!f) return;
  var pw=f.querySelector('[autocomplete="current-password"]'), caps=document.getElementById('capsw');
  if(!pw||!caps) return;
  function on(ev){ if(typeof ev.getModifierState==="function") caps.hidden=!ev.getModifierState("CapsLock"); }
  pw.addEventListener("keydown",on); pw.addEventListener("keyup",on);
  pw.addEventListener("blur",function(){ caps.hidden=true; });
})();
</script>

</main>



<script src="assets/orves.js"></script>
</body></html>
